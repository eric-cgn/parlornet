<?xml version="1.0" encoding="UTF-8"?>
<!-- Source of static/img/diagram-parlor.gif: python3 tools/diagrams.py parlor -->
<svg xmlns="http://www.w3.org/2000/svg" width="480" height="482" viewBox="0 0 480 482"
     font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#000000">
  <title>A parlor: the players' programs, the reverse proxy for ParlorNet Play, and the processes in the container</title>
  <defs>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"
            markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="480" height="482" fill="#FFFFFF"/>

  <g shape-rendering="crispEdges" stroke="#000000" stroke-width="1">
    <!-- the players' programs and the proxy -->
    <rect x="10.5" y="10.5" width="140" height="42" fill="#FFFFFF"/>
    <rect x="170.5" y="10.5" width="180" height="42" fill="#FFFFFF"/>
    <rect x="360.5" y="10.5" width="109" height="42" fill="#FFFFFF"/>
    <rect x="10.5" y="88.5" width="140" height="42" fill="#FFFFFF"/>
    <!-- the container and what runs in it -->
    <rect x="10.5" y="152.5" width="459" height="319" fill="#FFFFFF" stroke-dasharray="4,2"/>
    <rect x="20.5" y="182.5" width="410" height="92" fill="#FFFFCC"/>
    <rect x="20.5" y="296.5" width="130" height="34" fill="#FFFFCC"/>
    <rect x="170.5" y="296.5" width="160" height="34" fill="#FFFFCC"/>
    <rect x="20.5" y="354.5" width="439" height="48" fill="#99CC99"/>
    <rect x="20.5" y="424.5" width="200" height="36" fill="#FFFFCC"/>
    <rect x="240.5" y="424.5" width="219" height="36" fill="#FFFFFF"/>
  </g>

  <g stroke="#000000" stroke-width="1" marker-end="url(#head)">
    <line x1="80.5" y1="54" x2="80.5" y2="87"/>
    <line x1="80.5" y1="132" x2="80.5" y2="181"/>
    <line x1="255.5" y1="54" x2="255.5" y2="181"/>
    <line x1="450.5" y1="54" x2="450.5" y2="353"/>
  </g>
  <g stroke="#000000" stroke-width="1" marker-start="url(#head)" marker-end="url(#head)">
    <line x1="370.5" y1="276" x2="370.5" y2="353"/>
    <line x1="85.5" y1="332" x2="85.5" y2="353"/>
    <line x1="250.5" y1="332" x2="250.5" y2="353"/>
    <line x1="120.5" y1="404" x2="120.5" y2="423"/>
    <line x1="350.5" y1="404" x2="350.5" y2="423"/>
  </g>

  <text x="20" y="27" font-size="12" font-weight="bold">Today's browsers</text>
  <text x="20" y="42">and phones</text>
  <text x="180" y="27" font-size="12" font-weight="bold">Period programs</text>
  <text x="180" y="42">and any browser or telnet program</text>
  <text x="370" y="27" font-size="12" font-weight="bold">Native clients</text>
  <text x="370" y="42">PARLORNET/1</text>

  <text x="88" y="74">HTTPS</text>
  <text x="20" y="105" font-size="12" font-weight="bold">A reverse proxy</text>
  <text x="20" y="120">on the host, for TLS</text>
  <text x="88" y="146">127.0.0.1:6513</text>
  <text x="263" y="74">each on its</text>
  <text x="263" y="87">own port</text>
  <text x="442" y="74" text-anchor="end">6501</text>

  <text x="20" y="170" font-size="12" font-weight="bold">The container: one image, run as uid 10042</text>

  <text x="30" y="199" font-size="12" font-weight="bold">Server extensions, one process each</text>
  <text x="30" y="215">ParlorNet Play 6513, web 6500, telnet 6502, IOS 6503,</text>
  <text x="30" y="229">FIBS 6505, Outland 6506, DOoM 6507, GameMaster 6508,</text>
  <text x="30" y="243">NetSprocket 6512, batnav 6514, Awale 6515,</text>
  <text x="30" y="257">Networdz 6516, NetLuff 6517 (and 1744), ICDS 6518,</text>
  <text x="30" y="271">Worthy Opponent 6519, RSCARDS 6520</text>

  <text x="30" y="311" font-size="12" font-weight="bold">The bot</text>
  <text x="30" y="325">a player, with no port</text>
  <text x="180" y="311" font-size="12" font-weight="bold">The admin menus</text>
  <text x="180" y="325">6510, on the host's loopback</text>

  <text x="30" y="371" font-size="12" font-weight="bold">The core: parlord</text>
  <text x="30" y="386">the native protocol on 6501; the extension channel in TLS 1.3,</text>
  <text x="30" y="399">a key for each, on 127.0.0.1:6590; the admin socket on 6599</text>

  <text x="30" y="440" font-size="12" font-weight="bold">The plugin host</text>
  <text x="30" y="454">the games, started when needed</text>
  <text x="250" y="440" font-size="12" font-weight="bold">/data, a volume</text>
  <text x="250" y="454">the database and the keys</text>
</svg>
