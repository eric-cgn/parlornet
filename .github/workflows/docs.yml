# The docs site (http://docs.parlornet.org/): built from the repository by tools/build_docs.py, with the
# downloads fetched from the releases docsite/downloads.json pins, and published to GitHub Pages on every push to
# main. The site's CNAME file names docs.parlornet.org.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      # The downloads (Eclipse 68k Fix, Install ParlorNet Rulebooks and their READMEs) are built and released in
      # their own repositories: fetch the release files docsite/downloads.json pins and check each one's SHA-256.
      # A release that is not published yet stops the build here, named with its repository and tag.
      - name: Fetch the downloads
        run: python3 tools/fetch_downloads.py
      - name: Check the docs site
        run: python3 -m unittest discover -s tests -p "test_docs_site.py"
      - name: Build the docs site
        run: python3 tools/build_docs.py --out _site --require-downloads
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
          include-hidden-files: true   # the site's .nojekyll, as before

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
